<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fraud Detection | CreditGuard AI</title>
<link rel="stylesheet" href="static/css/main.css">
</head><body>

<nav class="navbar">
  <div class="nav-container">
    <a class="brand" href="/">
      <span class="brand-icon">🛡️</span>
      <span>CreditGuard AI</span>
    </a>
    <div class="nav-menu">
      <a href="dashboard.html" data-page="dashboard">Dashboard</a>
      <a href="predict.html" data-page="predict">Credit Risk</a>
      <a href="fraud.html" data-page="fraud">Fraud</a>
      <a href="message.html" data-page="message">Messages</a>
      <a href="batch.html" data-page="batch">Batch</a>
      <a href="analytics.html" data-page="analytics">Analytics</a>
      <a href="model.html" data-page="model">Model</a>
    </div>
  </div>
</nav>
<script>
document.querySelectorAll('.nav-menu a').forEach(a => {
  if (location.pathname.includes(a.dataset.page)) a.classList.add('active');
});
</script>

<main class="container">
<h1>🛡️ Transaction Fraud Detection</h1>
<p class="stat-label">Score a transaction using behavioral and transaction-risk signals.</p>
<div class="card">
<form id="fraudForm" class="form-grid">
  <div><label>Amount<input name="amount" type="number" value="250" step="0.01"></label></div>
  <div><label>Transaction Hour<input name="hour" type="number" value="14" min="0" max="23"></label></div>
  <div><label>Distance From Usual (km)<input name="distance_km" type="number" value="3" step="0.1"></label></div>
  <div><label>Transactions in 24h<input name="frequency_24h" type="number" value="2"></label></div>
  <div><label>New Device<select name="new_device"><option value="0">No</option><option value="1">Yes</option></select></label></div>
  <div><label>International<select name="international"><option value="0">No</option><option value="1">Yes</option></select></label></div>
  <div><label>Merchant Risk (0-1)<input name="merchant_risk" type="number" value="0.2" min="0" max="1" step="0.01"></label></div>
  <div style="display:flex;align-items:end"><button class="btn" type="submit">Scan Transaction</button></div>
</form>
<div id="fraudResult" class="result"></div>
</div>
</main>
<footer class="footer">CreditGuard AI • AI Credit Card Risk & Fraud Detection • Demo platform</footer>

<script>
document.getElementById("fraudForm").addEventListener("submit",async e=>{
 e.preventDefault(); const f=e.target; const data=Object.fromEntries(new FormData(f).entries());
 ["amount","hour","distance_km","frequency_24h","new_device","international","merchant_risk"].forEach(k=>data[k]=Number(data[k]));
 const box=document.getElementById("fraudResult"); box.className="result show"; box.innerHTML="<div class='card'>Scanning...</div>";
 try{const r=await fetch("/api/detect-fraud",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.detail);
 box.innerHTML=`<div class="card"><div class="stat-label">FRAUD SCORE</div><div class="result-score ${d.risk.toLowerCase()}">${d.fraud_score}%</div><h2 class="${d.risk.toLowerCase()}">${d.risk} RISK</h2><div class="alert">${d.recommendation}</div></div>`;
 }catch(err){box.innerHTML=`<div class="alert high">${err.message}</div>`}
});
</script>

</body></html>
